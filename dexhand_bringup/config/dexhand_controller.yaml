# ros parameters of dexhand_controller registered in ControllerManager
/**:  # 使用通配符允许任何命名空间
  dexhand_controller:
    ros__parameters:
      use_sim_time: false
      gesture_gpio: do_gesture
      # 需大于 hardware 的 gesture_timeout_ms（默认 5000）
      gesture_result_timeout_ms: 10000
      # hardware 层发布 HandInfo 的 bridge topic，需与 <ros2_control> 的 hand_info_topic 一致。
      # 用相对名，跟随节点 namespace 自动隔离：单手为 /hand_info，多手（namespace:=lh/rh）为 /lh/hand_info、/rh/hand_info
      hand_info_topic: hand_info
      joints:
        - FAJ3
        - FAJ1
        - THJ4
        - THJ3
        - THJ2
        - THJ1
        - FFJ4
        - FFJ3
        - FFJ2
        - MFJ4
        - MFJ3
        - MFJ2
        - RFJ4
        - RFJ3
        - RFJ2
        - LFJ4
        - LFJ3
        - LFJ2
      tactiles:
        - THT0
        - FFT0
        - MFT0
        - RFT0
        - LFT0
