publisher_forward_position_controller:
  ros__parameters:

    publish_topic: "/forward_position_controller/commands"
    wait_sec_between_publish: 1

    goal_names: ["pos1", "pos2", "pos3", "pos4"]
    pos1: [0.0, 0.3, 0.3, 0.5, 0.4, 0.5, 0.1,  0.3, 0.3, 0.5]
    pos2: [0.0, 0.5, 0.5, 0.7, 0.6, 0.7, 0.15, 0.6, 0.6, 0.7]
    pos3: [0.0, 0.76, 0.79, 0.959, 0.824, 0.976, 0.263, 1.282, 1.112, 0.959]
    pos4: [0.0, 0.5, 0.5, 0.7, 0.6, 0.7, 0.15, 0.6, 0.6, 0.7]


publisher_joint_trajectory_controller:
  ros__parameters:

    controller_name: "joint_trajectory_controller"
    wait_sec_between_publish: 2
    repeat_the_same_goal: 1 # useful to simulate continuous inputs

    goal_time_from_start: 1.0
    goal_names: ["pos1", "pos2", "pos3", "pos4"]
    pos1:
      positions: [0.0, 0.3, 0.3, 0.5, 0.4, 0.5, 0.1,  0.3, 0.3, 0.5]
    pos2:
      positions: [0.0, 0.5, 0.5, 0.7, 0.6, 0.7, 0.15, 0.6, 0.6, 0.7]
    pos3:
      positions: [0.0, 0.76, 0.79, 0.959, 0.824, 0.976, 0.263, 1.282, 1.112, 0.959]
    pos4:
      positions: [0.0, 0.5, 0.5, 0.7, 0.6, 0.7, 0.15, 0.6, 0.6, 0.7]

    joints:
      - palm_yaw_joint
      - palm_pitch_joint
      - index_bottom_joint
      - index_middle_joint
      - index_tip_joint
      - thumb_yaw_joint
      - thumb_pitch_joint
      - thumb_base_joint
      - thumb_bottom_joint
      - thumb_tip_joint
